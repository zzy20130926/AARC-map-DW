<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AARC公共地图规划讨论平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        aarc: '#0E42D2',
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 h-screen overflow-hidden">
    <!-- 登录/注册弹窗 -->
    <div id="authModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl p-8 w-full max-w-md shadow-2xl">
            <div class="flex mb-6 border-b">
                <button id="loginTab" class="flex-1 py-3 font-medium text-primary border-b-2 border-primary">登录</button>
                <button id="registerTab" class="flex-1 py-3 font-medium text-gray-500">注册</button>
            </div>
            
            <!-- 登录表单 -->
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                    <input type="text" id="loginUsername" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                    <input type="password" id="loginPassword" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none" required>
                </div>
                <button type="submit" class="w-full bg-primary hover:bg-primary/90 text-white py-3 rounded-lg font-medium transition">登录平台</button>
            </form>

            <!-- 注册表单 -->
            <form id="registerForm" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">设置用户名</label>
                    <input type="text" id="regUsername" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">设置密码</label>
                    <input type="password" id="regPassword" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">确认密码</label>
                    <input type="password" id="regPasswordConfirm" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none" required>
                </div>
                <button type="submit" class="w-full bg-aarc hover:bg-aarc/90 text-white py-3 rounded-lg font-medium transition">注册账号</button>
            </form>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="mainApp" class="h-full hidden">
        <!-- 顶部导航栏 -->
        <header class="bg-white shadow-sm px-6 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-aarc">AARC 公共地图规划讨论平台</h1>
            <div class="flex items-center gap-4">
                <span id="currentUser" class="text-gray-700">欢迎，用户</span>
                <button id="logoutBtn" class="px-4 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm transition">退出登录</button>
            </div>
        </header>

        <div class="flex h-[calc(100vh-64px)]">
            <!-- 左侧地图区域 -->
            <div class="w-2/3 h-full">
                <div id="map" class="w-full h-full"></div>
            </div>

            <!-- 右侧聊天讨论区 -->
            <div class="w-1/3 bg-white border-l flex flex-col">
                <div class="p-4 border-b">
                    <h2 class="font-semibold text-lg">规划讨论群聊</h2>
                </div>
                
                <!-- 消息列表 -->
                <div id="messageList" class="flex-1 overflow-y-auto p-4 space-y-3">
                    <div class="bg-gray-50 p-3 rounded-lg">
                        <div class="text-xs text-gray-500 mb-1">系统公告</div>
                        <p class="text-sm">欢迎来到AARC公共地图规划讨论平台，你可以在地图上标记点位并在群聊中交流规划想法。</p>
                    </div>
                </div>

                <!-- 消息输入区 -->
                <div class="p-4 border-t">
                    <form id="messageForm" class="flex gap-2">
                        <input type="text" id="messageInput" placeholder="输入你的规划讨论内容..." class="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none">
                        <button type="submit" class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg transition">发送</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 本地存储用户数据和消息数据
        const users = JSON.parse(localStorage.getItem('aarc_users')) || [];
        const messages = JSON.parse(localStorage.getItem('aarc_messages')) || [];
        let currentLoggedInUser = localStorage.getItem('aarc_current_user') || null;
        let map;

        // 页面初始化
        window.onload = function() {
            // 切换登录/注册标签
            document.getElementById('loginTab').addEventListener('click', () => {
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('loginTab').classList.add('text-primary', 'border-b-2', 'border-primary');
                document.getElementById('registerTab').classList.remove('text-primary', 'border-b-2', 'border-primary');
                document.getElementById('registerTab').classList.add('text-gray-500');
            });

            document.getElementById('registerTab').addEventListener('click', () => {
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerTab').classList.add('text-primary', 'border-b-2', 'border-primary');
                document.getElementById('loginTab').classList.remove('text-primary', 'border-b-2', 'border-primary');
                document.getElementById('loginTab').classList.add('text-gray-500');
            });

            // 注册逻辑
            document.getElementById('registerForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const username = document.getElementById('regUsername').value.trim();
                const password = document.getElementById('regPassword').value;
                const confirmPwd = document.getElementById('regPasswordConfirm').value;

                if(users.find(u => u.username === username)) {
                    alert('该用户名已被注册，请更换用户名');
                    return;
                }
                if(password !== confirmPwd) {
                    alert('两次输入的密码不一致');
                    return;
                }

                users.push({username, password});
                localStorage.setItem('aarc_users', JSON.stringify(users));
                alert('注册成功，请登录你的账号');
                document.getElementById('loginTab').click();
            });

            // 登录逻辑
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value;

                const user = users.find(u => u.username === username && u.password === password);
                if(!user) {
                    alert('用户名或密码错误');
                    return;
                }

                currentLoggedInUser = username;
                localStorage.setItem('aarc_current_user', username);
                enterMainApp();
            });

            // 退出登录
            document.getElementById('logoutBtn').addEventListener('click', () => {
                currentLoggedInUser = null;
                localStorage.removeItem('aarc_current_user');
                document.getElementById('mainApp').classList.add('hidden');
                document.getElementById('authModal').classList.remove('hidden');
            });

            // 发送消息逻辑
            document.getElementById('messageForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const content = document.getElementById('messageInput').value.trim();
                if(!content) return;

                const newMsg = {
                    user: currentLoggedInUser,
                    content: content,
                    time: new Date().toLocaleTimeString().slice(0,5)
                };
                messages.push(newMsg);
                localStorage.setItem('aarc_messages', JSON.stringify(messages));
                renderMessages();
                document.getElementById('messageInput').value = '';
            });

            // 如果已经登录，直接进入主界面
            if(currentLoggedInUser) {
                enterMainApp();
            }
        };

        // 进入主应用，初始化地图和消息
        function enterMainApp() {
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('currentUser').textContent = `欢迎，${currentLoggedInUser}`;
            
            // 初始化Leaflet地图，默认定位杭州
            map = L.map('map').setView([30.2741, 120.1551], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            // 点击地图添加规划点位标记
            map.on('click', (e) => {
                const markerMsg = {
                    user: currentLoggedInUser,
                    content: `标记点位：经度${e.latlng.lng.toFixed(4)}，纬度${e.latlng.lat.toFixed(4)}`,
                    time: new Date().toLocaleTimeString().slice(0,5),
                    latlng: e.latlng
                };
                L.marker(e.latlng).addTo(map).bindPopup(`<b>${currentLoggedInUser} 标记的规划点位</b>`).openPopup();
                messages.push(markerMsg);
                localStorage.setItem('aarc_messages', JSON.stringify(messages));
                renderMessages();
            });

            renderMessages();
        }

        // 渲染所有聊天消息
        function renderMessages() {
            const msgList = document.getElementById('messageList');
            // 保留系统公告第一条
            const firstChild = msgList.children[0];
            msgList.innerHTML = '';
            msgList.appendChild(firstChild);

            messages.forEach(msg => {
                const msgItem = document.createElement('div');
                msgItem.className = `p-3 rounded-lg max-w-[90%] ${msg.user === currentLoggedInUser ? 'bg-primary/10 ml-auto' : 'bg-gray-50'}`;
                msgItem.innerHTML = `
                    <div class="flex justify-between text-xs text-gray-500 mb-1">
                        <span>${msg.user}</span>
                        <span>${msg.time}</span>
                    </div>
                    <p class="text-sm">${msg.content}</p>
                `;
                msgList.appendChild(msgItem);
            });
            // 滚动到底部
            msgList.scrollTop = msgList.scrollHeight;
        }
    </script>
</body>
</html>
